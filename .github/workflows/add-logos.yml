name: Add Azal and ministry logos
on:
  push:
    paths: ['.github/workflows/add-logos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch logos
        run: |
          set -euo pipefail
          pip install pillow
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/mohamed772370-m/yemen-academy-data/main/assets/logos/uni-72a3ad00.webp' -o /tmp/azal.webp
          python3 - <<'PY'
          import json,re,base64,io,hashlib
          from PIL import Image
          assert hashlib.sha256(open('original/index.html','rb').read()).hexdigest()=='2a554221cd5a5c7bca789ea51aa590172cf9b866a94c1057568ce93f68df49a3'
          raw=open('site-data.json',encoding='utf-8').read().strip()
          d=json.loads(raw)
          A='جامعة آزال للتنمية البشرية'; M='وزارة التعليم العالي (خطة موحدة)'
          im=Image.open('/tmp/azal.webp').convert('RGB').resize((512,512),Image.LANCZOS)
          b=io.BytesIO(); im.save(b,'WEBP',quality=88)
          d['logos'][A]='data:image/webp;base64,'+base64.b64encode(b.getvalue()).decode()
          o=open('original/index.html',encoding='utf-8').read()
          sl=re.search(r'const SERVICE_LOGOS=(\{.*?\});\n',o,re.S).group(1)
          d['logos'][M]=json.loads(sl)['min']
          new=json.dumps(d,ensure_ascii=False,separators=(',',':'))
          h=open('index.html',encoding='utf-8').read()
          assert h.count(raw)==1 and 'const SERVICE_LOGOS={};' in h
          h=h.replace(raw,new,1).replace('const SERVICE_LOGOS={};','const SERVICE_LOGOS='+sl+';',1)
          assert len(d['rows'])==7822 and len(d['guide'])==228 and len(d['summary'])==26 and len(d['logos'])==7
          open('index.html','w',encoding='utf-8').write(h)
          open('site-data.json','w',encoding='utf-8').write(new)
          PY
          sha256sum index.html site-data.json original/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add Azal and ministry logos, restore scholarship logos'
            git push
          fi
