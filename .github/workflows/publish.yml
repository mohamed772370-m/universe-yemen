name: Publish supplied template with Excel
on:
  push:
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified supplied-template build
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://drive.google.com/uc?id=1oEz2cTYGDr9jonUKyNa19cXwrRsTebxH&export=download' -o /tmp/project.zip
          echo '134d2a4daf19f9ffbcdd6f05cddf3bf34567e9880f3c61d1e8ceae12b8689bfa  /tmp/project.zip' | sha256sum -c -
          unzip -o /tmp/project.zip
          echo 'de554097268278872163b87bdbbb9d56ffd2ecc2d3bf495da7f43db1706d6c22  index.html' | sha256sum -c -
          echo 'dcadbc817a6d3dc0c125bc41ff89333d00d68a343490a14f55468cf8dd903821  site-data.json' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site-data.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Apply complete Excel to supplied UniVerse template'
            git push
          fi
